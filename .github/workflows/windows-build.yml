name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.arch }}
      - run: npm ci
      - name: Check version and tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          if (pkg.version !== config.version) throw new Error('Package/Tauri version mismatch');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag does not match the app version');
          }
          JS
      - name: Offline regression tests
        run: npm test
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
      - name: Build macOS installer
        env:
          CI: 'true'
        run: npm run release:mac -- --target ${{ matrix.target }} -- --locked
      - name: Name installer and generate checksum
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle/dmg
        env:
          INSTALLER_ARCH: ${{ matrix.arch }}
        run: |
          version=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version')
          installers=(./*.dmg)
          if [[ ${#installers[@]} -ne 1 || ! -f "${installers[0]}" ]]; then
            echo "Expected exactly one DMG installer" >&2
            exit 1
          fi
          filename="FolioReader_${version}_macOS_${INSTALLER_ARCH}.dmg"
          if [[ "${installers[0]}" != "./${filename}" ]]; then
            mv "${installers[0]}" "$filename"
          fi
          shasum -a 256 "$filename" > "SHA256SUMS-macos-${INSTALLER_ARCH}.txt"
          shasum -a 256 -c "SHA256SUMS-macos-${INSTALLER_ARCH}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: folio-reader-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/FolioReader_*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check version and tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne $config.version) { throw 'Package/Tauri version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw 'Release tag does not match the app version'
          }
      - name: Offline regression tests
        run: npm test
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows x64 installer
        run: npm run release:windows -- -- --locked
      - name: Name installer and generate checksum
        shell: pwsh
        run: |
          $folder = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem $folder -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $filename = "FolioReader_${version}_Windows_x64.exe"
          $destination = Join-Path $folder $filename
          Move-Item -LiteralPath $installers[0].FullName -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLower()
          "$hash  $filename" | Set-Content (Join-Path $folder 'SHA256SUMS-windows-x64.txt') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: folio-reader-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/FolioReader_*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30
